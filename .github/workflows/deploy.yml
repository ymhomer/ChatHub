name: Deploy ChatHub

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chathub-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHATHUB_FRONTEND_ORIGIN: https://ymhomer.github.io
  CHATHUB_API_ORIGIN: https://chathub-api.ymhomer-4253.workers.dev
  CHATHUB_WORKER_NAME: chathub-api
  CHATHUB_BASE: /ChatHub/
  CHATHUB_D1_NAME: ${{ secrets._D1_NAME || vars.CHATHUB_D1_NAME }}
  CHATHUB_D1_ID: ${{ secrets._D1_ID || vars.CHATHUB_D1_ID }}
  CHATHUB_R2_BUCKET: ${{ secrets._R2_BUCKET || vars.CHATHUB_R2_BUCKET }}

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate deployment settings
        run: |
          test -n "$CHATHUB_D1_NAME" || { echo "::error::Missing _D1_NAME"; exit 1; }
          test -n "$CHATHUB_D1_ID" || { echo "::error::Missing _D1_ID"; exit 1; }
          test -n "$CHATHUB_R2_BUCKET" || { echo "::error::Missing _R2_BUCKET"; exit 1; }
      - run: npm ci
      - run: npm run build:pages
      - run: npm run build
      - name: Apply D1 schema and deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --no-install wrangler d1 migrations apply "$CHATHUB_D1_NAME" --remote --config dist/server/wrangler.json
          npx --no-install wrangler deploy --config dist/server/wrangler.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy-pages:
    needs: build-and-deploy-api
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
